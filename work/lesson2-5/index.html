<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="expires" content="604800">
  <meta name="format-detection" content="email=no,telephone=no,address=no">
  <title>株式会社CONVICTION SHOP</title>
  <meta name="description" content="株式会社CONVICTION SHOPの企業サイトです">
  <link rel="icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="l-wrapper">
    <header class="l-header">
      <h1 class="c-heading">- Catalog -</h1>
    </header>
    <main>
      <section class="p-pickup">
        <h2 class="c-pickup__title">PickUp</h2>
        <div class="c-pickup__item">
          <div class="c-imageinner">
            <img src="assets/images/lesson2/img_pickup.jpg" alt="スマートウォッチの画像">
          </div>
          <div class="c-itemHeader">
            <h2 class="c-itemName">スマートウォッチ</h2>
            <a href="#"><img src="assets/images/lesson2/logo_pickup.png" alt="カートの画像"></a>
          </div>
          <p class="c-itemView">洗練されたデザインと最先端の技術を兼ね備えたスマートウォッチです。</p>
          <div class="p-blockInner">
            <p class="c-block">カラー：モカグレー</p>
            <p class="c-block">サイズ：S/M/L</p>
            <p class="c-block">バッテリー：最大7日間</p>
            <p class="c-block">充電時間：約2時間</p>
          </div>
          <p class="c-price"><a class="c-smallText">&yen;</a>19,800<a class="c-smallText">（税込）</a></p>
          <a href="#"><p class="c-tag">#おしゃれ</p></a>
          <a href="#"><p class="c-tag">#シンプル</p></a>
          <a href="#"><p class="c-tag">#普段使い</p></a>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
